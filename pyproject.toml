[project]
name = "emporio-da-musica-agent"
version = "0.1.0"
description = "Agente de atendimento ao cliente da Empório da Música"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.0",
    "streamlit==1.66.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.0.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "RUF",
    "ANN",
    "PL",
    "RET",
    "C90",
    "ERA",
    "T20",
    "ARG",
    "S608",
]

[tool.ruff.lint.pylint]
max-args = 4
max-branches = 6
max-returns = 4
max-statements = 20

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "PLR"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["emporio_agent", "tests", "app.py"]
disallow_any_explicit = true
disallow_any_unimported = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "-m", "not live"]
filterwarnings = ["error"]
markers = ["live: calls the real model API"]
