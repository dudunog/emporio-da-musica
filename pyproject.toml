[project]
name = "emporio-da-musica-agent"
version = "0.1.0"
description = "Agente de atendimento ao cliente da Empório da Música"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "python-dotenv>=1.2.0",
    "streamlit>=1.66.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.0.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "PLR"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["emporio_agent"]

[[tool.mypy.overrides]]
module = ["streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
