[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"
showErrorLinks = false

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap, system-ui, sans-serif"
baseRadius = "18px"
buttonRadius = "full"
showWidgetBorder = false
paddingTop = "0.5rem"
paddingBottom = "1rem"

[theme.light]
primaryColor = "#B4531A"
backgroundColor = "#FFFBF5"
secondaryBackgroundColor = "#F5EFE6"
textColor = "#1C1917"
borderColor = "#E4DCD0"
linkColor = "#B4531A"

[theme.dark]
primaryColor = "#E8955A"
backgroundColor = "#16130F"
secondaryBackgroundColor = "#27221C"
textColor = "#F3EDE4"
borderColor = "#35302A"
linkColor = "#E8955A"
